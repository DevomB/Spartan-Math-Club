  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="760" y="280" fill="#f8f7f3" font-size="94" font-weight="700" letter-spacing="-2">
      Spartan Mathematics Club
    </text>
    <text x="765" y="368" fill="#d7a737" font-size="45" font-weight="600" letter-spacing="1.5">
      San José State University
    </text>
  </g>

  <line x1="765" y1="418" x2="1900" y2="418" stroke="#7894a1" stroke-width="2"/>
  <text
    x="765"
    y="492"
    fill="#dce5e9"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="35"
